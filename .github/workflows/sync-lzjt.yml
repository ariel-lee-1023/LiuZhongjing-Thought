name: Sync LZJT from 得到大脑

on:
  schedule:
    # every Sunday 02:00 UTC ≈ 10:00 CST
    - cron: "0 2 * * 0"
  workflow_dispatch:
    # manual run from Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # needed so the push step can create the commit on the same branch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # markitdown[pdf] pulls pdfminer.six + friends
          pip install "markitdown[pdf]" requests

      - name: Run sync
        env:
          API: ${{ secrets.API }}
          CLIENT: ${{ secrets.CLIENT }}
        run: |
          python scripts/sync_from_biji.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ || true
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: sync LZJT notes from 得到大脑 topic 40D9VmeJ $(date -u +%Y-%m-%d)"
            git push
          fi
